<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Booking request received | MoonBloom Reiki Healing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 50% 35%, rgba(157,135,212,0.2), transparent 38%),
        #1a1530;
      color: #fdf8f4;
      font-family: 'DM Sans', sans-serif;
      text-align: center;
    }
    main { max-width: 620px; }
    .mark {
      width: 4rem;
      height: 4rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
      border: 1px solid rgba(201,184,232,0.55);
      border-radius: 50%;
      color: #c9b8e8;
      font-size: 1.3rem;
    }
    .eyebrow {
      margin-bottom: 1rem;
      color: #c9b8e8;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1.25rem;
      font-family: 'Cormorant Garant', serif;
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      font-weight: 300;
      line-height: 1.05;
    }
    h1 em { color: #c9b8e8; font-weight: 300; }
    p { color: rgba(253,248,244,0.68); line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 1.8rem;
      border: 1px solid #c9b8e8;
      border-radius: 3rem;
      color: #c9b8e8;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    a:hover, a:focus-visible { background: #c9b8e8; color: #1a1530; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p class="eyebrow">Request received</p>
    <h1>Thank you for reaching <em>out</em></h1>
    <p>Your booking request has been sent. You'll receive an email confirming availability, followed by a secure payment link and your session details.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
